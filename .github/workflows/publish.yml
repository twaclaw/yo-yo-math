name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy straight to Pages from the build artifact: no gh-pages branch, so the
# repo never grows by one full copy of the site per publish.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          # Comic Sans MS (sansfont) ships in ttf-mscorefonts-installer; CMU Serif
          # (mainfont) in fonts-cmu. Without them lualatex silently substitutes.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          # poppler-utils supplies pdftocairo, which the diagram filter uses to
          # turn TikZ PDFs into SVG. Inkscape is kept as the fallback.
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin inkscape poppler-utils fonts-cmu ttf-mscorefonts-installer
          sudo fc-cache -f

      - name: Headless Chrome shared libraries
        # Best-effort: the runner image ships most of these, and the audio
        # library was renamed between Ubuntu releases. Chrome does not need it
        # for image export, so a miss here must not fail the build.
        run: |
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libgbm1 || true
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2 || true

      # setup-uv publishes no floating major tag past v7, so pin exactly.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run plotly_get_chrome -y   # kaleido renders the Plotly figures

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # katex, for the post-render pass

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: LaTeX packages for the TikZ diagram filter
        # The filter shells out to pdflatex itself, so Quarto's on-demand
        # package installation never covers it, and TinyTeX ships neither
        # standalone nor pgf. Without these every TikZ figure fails to compile.
        run: |
          TEXBIN=$(dirname "$(find "$HOME/.TinyTeX/bin" -name pdflatex | head -1)")
          echo "TeX binaries: $TEXBIN"
          # Quarto knows where TinyTeX lives and uses it for its own PDF pass,
          # but the diagram filter shells out to a bare `pdflatex`, so the
          # directory has to be on PATH in the render step too, not just here.
          echo "$TEXBIN" >> "$GITHUB_PATH"
          export PATH="$TEXBIN:$PATH"
          # TinyTeX pins an older tlmgr than the package repository it points
          # at, and tlmgr refuses to install anything until it updates itself.
          tlmgr update --self
          tlmgr install standalone pgf
          # Fail here, with a clear reason, rather than at render time.
          kpsewhich standalone.cls tikz.sty

      # Code execution (Plotly/kaleido) dominates the build; reuse it when no
      # source or script changed, and fall back to the newest cache otherwise.
      - uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ hashFiles('**/*.qmd', 'scripts/**', 'uv.lock') }}
          restore-keys: freeze-

      - run: uv run quarto render   # both html and pdf in one pass

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
